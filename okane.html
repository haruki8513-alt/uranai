<script>
const qsMoney=['収支の記録を定期的にしていますか？','毎月一定の金額を貯金していますか？','衝動買いをしやすいですか？','投資や将来設計を考えていますか？','借入やローンの管理ができていますか？','生活費の見直しを定期的にしていますか？','大きな出費に備えた準備がありますか？','お金に関する情報を学ぶ習慣がありますか？','負債が生活を圧迫していますか？','将来の目標に向けて貯蓄していますか？'];

</script>
