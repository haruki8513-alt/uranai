<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>無料性格診断</title><meta name="description" content="10問に答えて自分のタイプをチェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/seikaku.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>🧠 無料性格診断</h1><p>10問に答えて性格タイプをチェックできます。</p><section class="panel" id="questions"></section><button onclick="diagnose()">診断する</button><div id="result"></div></main><script>const qs=['休みの日は家で過ごしたい？','初対面でも話せる？','落ち着いていると言われる？','気分転換は一人が好き？','丁寧に進める？','人と話すのが好き？','変化が好き？','自分は自由なタイプ？','忙しくても行動できる？','刺激のある環境が好き？'];document.querySelector('#questions').innerHTML=qs.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="2">どちらともいえない</option><option value="3">いいえ</option></select>').join('');function diagnose(){let n=0;for(let i=0;i<10;i++)n+=+document.querySelector('#q'+i).value;let r=n<=13?'慎重で落ち着いたタイプ':n<=22?'安定したバランスタイプ':'自由で行動力のあるタイプ';document.querySelector('#result').innerHTML='<section class="result"><h2>診断結果</h2><p>あなたは<strong>'+r+'</strong>です。</p></section>'}</script></body></html>
