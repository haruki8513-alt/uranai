<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仕事タイプ診断</title><meta name="description" content="10問で自分の仕事タイプや向いている働き方を簡単にチェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/work.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>💼 仕事タイプ診断</h1><p>10問に答えて、自分に合う働き方を考える参考にしましょう。</p><section class="panel" id="questions"></section><button id="work-diag">診断する</button><div id="result"></div><p>この診断は適職を断定するものではありません。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>const qsWork=['チームで働くのが好きですか？','新しいことに挑戦したいですか？','安定した環境が好きですか？','人と話す仕事が苦ではないですか？','一人で集中する時間が好きですか？','責任ある仕事を任されたいですか？','自由に動ける仕事が好きですか？','成果が数字で見えると嬉しいですか？','計画を立てて進めるのが得意ですか？','仕事は楽しさを重視しますか？'];document.getElementById('questions').innerHTML=qsWork.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');document.getElementById('work-diag').addEventListener('click', ()=>{let n=0;for(let i=0;i<10;i++)n+=+document.getElementById('q'+i).value;let type='', summary='', strengths=[], cautions=[], advice=[]; if(n<=3){type='安定志向タイプ';summary='安定性を重視し、確実にこなす力があるタイプです。';strengths=['計画的に動ける','信頼性が高い'];cautions=['変化に弱い傾向がある'];advice=['小さな新しい挑戦を月に1回取り入れる','自分の意見を一つずつ表現する習慣をつける'];} else if(n<=6){type='バランス型タイプ';summary='安定と挑戦のバランスが取れているため、幅広い職場で活躍できます。';strengths=['状況に応じた柔軟性','チームでの協調力'];cautions=['優先順位が曖昧になることがある'];advice=['目標を短期・中期で分ける','成果を振り返る時間を作る'];} else if(n<=8){type='自由・専門型タイプ';summary='自分の専門性や裁量を生かすのが得意なタイプです。';strengths=['独立して行動できる','専門性を伸ばす意欲がある'];cautions=['独りよがりになりやすい'];advice=['フィードバックを定期的に受ける','チームと成果を共有する習慣をつける'];} else {type='挑戦・リーダータイプ';summary='積極的に動き、周囲を引っ張るリーダーシップがあります。';strengths=['行動力がある','周囲を巻き込める'];cautions=['短絡的な判断に注意'];advice=['計画を言語化して共有する','重要な決断は一呼吸置いて検討する'];}const obj={title:'あなたは「'+type+'」',summary:summary,strengths:strengths,cautions:cautions,advice:advice,extra:'結果は参考情報です。状況に応じて活用してください。'};renderDetailedResult('#result', obj);});</script>
</body></html>
