<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>友達相性診断</title><meta name="description" content="10問で友達との相性や話しやすさを無料チェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/friend.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>👭 友達相性診断</h1><p>10問に答えて、友達との相性を気軽にチェックできます。</p><section class="panel" id="questions"></section><button id="friend-diag">診断する</button><div id="result"></div><p>この診断はエンターテインメント目的の簡易診断です。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>const qsFriend=['一緒にいると落ち着きますか？','話が自然と続きますか？','趣味が似ていますか？','気を使わず話せますか？','一緒にいると楽しいですか？','悩みを相談しやすいですか？','相手の気持ちを理解しやすいですか？','ケンカしてもすぐ仲直りできますか？','一緒にいる時間があっという間ですか？','長く付き合えそうですか？'];document.getElementById('questions').innerHTML=qsFriend.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');document.getElementById('friend-diag').addEventListener('click', ()=>{let n=0;for(let i=0;i<10;i++)n+=+document.getElementById('q'+i).value;let score=n*10;let obj={title:'友達との相性: '+score+'%',summary:'友達との相性は'+score+'％です。',strengths:[],cautions:[],advice:[]};if(score>=80){obj.summary='とても相性が良いです。自然体でいられる関係です。';obj.strengths=['居心地が良い','相談しやすい'];obj.advice=['時間を共有して関係を深める','感謝の言葉を伝える'];}else if(score>=60){obj.summary='良い関係性です。お互いに支え合える関係。';obj.strengths=['話が合う場面が多い'];obj.cautions=['忙しさで連絡が減ると距離ができることがある'];obj.advice=['定期的に連絡を取る工夫をする'];}else if(score>=40){obj.summary='普通の相性です。関係を育てる余地があります。';obj.cautions=['価値観の違いに注意'];obj.advice=['相手の話をよく聞く習慣を持つ'];}else{obj.summary='改善の余地があります。無理に近づこうとせず距離感を整えることも大切です。';obj.cautions=['感情的な衝突に注意'];obj.advice=['距離を置いて整理する時間を持つ'];}renderDetailedResult('#result', obj);});</script>
</body></html>
