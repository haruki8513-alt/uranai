<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>無料占い｜今日の運勢をチェック</title><meta name="description" content="星座と血液型から今日の運勢を簡単にチェックできる無料占いです。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/uranai.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold;cursor:pointer}a{color:#dfe6ff}.home{display:inline-block;margin-bottom:12px}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>🔮 無料占い</h1><p>星座と血液型から今日の運勢をチェックできます。</p><section class="panel"><label>星座<select id="sign"><option>おひつじ座</option><option>おうし座</option><option>ふたご座</option><option>かに座</option><option>しし座</option><option>おとめ座</option><option>てんびん座</option><option>さそり座</option><option>いて座</option><option>やぎ座</option><option>みずがめ座</option><option>うお座</option></select></label><label>血液型<select id="blood"><option>A</option><option>B</option><option>O</option><option>AB</option></select></label><button onclick="show()">今日の運勢を見る</button></section><div id="result"></div><p class="note">この占いはエンターテインメント目的の簡易占いです。</p></main><script>function show(){let a=['最高','良い','普通','注意'][Math.floor(Math.random()*4)];document.querySelector('#result').innerHTML='<section class="result"><h2>今日の運勢</h2><p>運勢は<strong>'+a+'</strong>です。</p><p>'+document.querySelector('#sign').value+'・'+document.querySelector('#blood').value+'型</p></section>'}</script></body></html>
