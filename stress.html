<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ストレスチェック｜無料で今の状態を確認</title><meta name="description" content="9問の簡易チェックで、最近の疲れやストレスの状態を確認できます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/stress.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold;cursor:pointer}a{color:#dfe6ff}.home{display:inline-block;margin-bottom:12px}.note{font-size:.9rem}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>😵 ストレスチェック</h1><p>最近の疲れや気分を振り返るための簡易チェックです。</p><section class="panel" id="questions"></section><button onclick="diagnose()">チェックする</button><div id="result"></div><p class="note">医学的な診断ではありません。つらい状態が続く場合は、医療機関や相談窓口にご相談ください。</p></main><script>const qs=['最近疲れが取れにくいですか？','朝起きてもやる気が出ませんか？','眠りが浅いと感じますか？','食欲に変化がありますか？','イライラしやすいですか？','集中力が続きませんか？','人と話すのがしんどいですか？','不安になりやすいですか？','休んでも回復しにくいですか？'];document.querySelector('#questions').innerHTML=qs.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');function diagnose(){let n=0;for(let i=0;i<9;i++)n+=+document.querySelector('#q'+i).value;let r=n<=3?'少し疲れを感じている可能性があります':n<=6?'ストレスがたまっている可能性があります':'かなり疲れている可能性があります';document.querySelector('#result').innerHTML='<section class="result"><h2>チェック結果</h2><p><strong>'+r+'</strong></p><p>無理をせず、睡眠・休憩・身近な人への相談を意識してください。</p></section>'}</script></body></html>
