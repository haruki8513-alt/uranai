<style>
/* ---------- 基本 ---------- */
:root{
  --accent1: #ff88cc;
  --accent2: #ff66bb;
  --glass: rgba(255,255,255,0.12);
}
*{box-sizing:border-box}
body {
  margin: 0;
  font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  background: linear-gradient(180deg,#07102a 0%, #0b0f2f 60%);
  color: #fff;
  overflow-x: hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ---------- 星・背景 ---------- */
#star-container {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -3;
  overflow: hidden;
}
.star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.9;
  animation: floatStar 12s linear infinite;
  transform: translateZ(0);
}
@keyframes floatStar {
  from { transform: translateY(0px) scale(1); opacity: 1; }
  to { transform: translateY(-220px) scale(0.8); opacity: 0; }
}
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://i.imgur.com/5Rj5H1v.png');
  animation: moveStars 80s linear infinite;
  z-index: -2;
  opacity: 0.9;
}
@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: -3000px 3000px; }
}

/* タイプ背景 */
#typeBackground {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0.28;
  pointer-events: none;
  z-index: -1;
  filter: blur(6px) saturate(1.05);
}

/* ---------- ヘッダー ---------- */
h1 {
  text-align: center;
  margin-top: 22px;
  font-size: 34px;
  letter-spacing: 1px;
  text-shadow: 0 0 18px rgba(255,140,190,0.25);
  color: #fff;
}

/* ---------- コンテナ ---------- */
#home-screen {
  animation: fadeIn 0.8s ease;
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  padding: 28px;
  border-radius: 20px;
  width: 92%;
  max-width: 980px;
  margin: 18px auto 60px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- ホームカード（強化） ---------- */
.home-card {
  width: 250px;
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.92));
  color: #333;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 4px 12px rgba(255,255,255,0.06) inset;
  cursor: pointer;
  transition: transform .28s cubic-bezier(.2,.9,.2,1), box-shadow .28s;
  text-align: center;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.6);
  backdrop-filter: blur(6px);
}
.home-card h3{ font-size:20px; margin:0 0 8px; }
.home-card p{ margin:0; font-size:13px; color:#666; }
.home-card::after {
  content: "";
  position: absolute;
  top: -40%;
  left: -40%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(255,200,230,0.12), transparent 10%),
              radial-gradient(circle at 70% 70%, rgba(200,240,255,0.06), transparent 10%);
  transform: rotate(12deg);
  transition: transform .6s;
  pointer-events: none;
}
.home-card:hover::after { transform: rotate(0deg) translateY(-6px); }
.home-card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
}

/* ---------- モードフォーム ---------- */
.mode {
  max-width: 560px;
  margin: 20px auto;
  display: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.04);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);

label { display:block; margin-top:12px; font-size:14px; color:#f7f7f7; }
input, select {

  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:none;
  background:#ffffffee;
  color:#333;

/* ---------- ボタン ---------- */
button {
  padding: 10px 22px;

  font-size: 15px;
  border-radius: 25px;

/* 戻るボタン */

  border-radius: 20px;

<script>

/* 動く星生成（色付き・増量で幻想的に） */
function createStars(){
  const c=document.getElementById("star-container");
  if(!c) return;
  c.innerHTML = "";
  const colors=["#ffffff","#ffe6ff","#ccf2ff","#fff5e6"];
  const count = 120;
  for(let i=0;i<count;i++){
    const s=document.createElement("div");
    s.classList.add("star");
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDelay = (Math.random()*8) + "s";
    s.style.opacity = (0.4 + Math.random()*0.9).toString();
    s.style.transform = `scale(${0.6 + Math.random()*1.2})`;
    c.appendChild(s);
  }
}
createStars();

/* モード切り替え */
function openMode(id){
  const home = document.getElementById("home-screen");
  if(home) home.style.display = "none";
  const modes = document.getElementsByClassName("mode");
  for(let m of modes){ m.style.display = "none"; }
  const el = document.getElementById(id);
  if(el) el.style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function backHome(){
  const modes=document.getElementsByClassName("mode");
  for(let m of modes){ m.style.display="none"; }
  const home=document.getElementById("home-screen");
  if(home) home.style.display="block";
  const tb=document.getElementById("typeBackground");
  if(tb) tb.style.backgroundImage="";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* 結果表示にシェア・保存ボタンを付ける共通関数 */
function renderResultWithActions(containerId, htmlContent){
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = htmlContent;
  const shareBtn = document.createElement("button");
  shareBtn.className = "share-btn";
  shareBtn.textContent = "結果をシェアする";
  shareBtn.onclick = () => shareResult(containerId);
  const saveBtn = document.createElement("button");
  saveBtn.className = "share-btn";
  saveBtn.style.background = "linear-gradient(135deg,#ff88cc,#ff66bb)";
  saveBtn.textContent = "画像で保存する";
  saveBtn.onclick = () => saveImage(containerId);
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.gap = "10px";
  wrap.style.marginTop = "12px";
  wrap.appendChild(shareBtn);
  wrap.appendChild(saveBtn);
  container.appendChild(wrap);
}

/* シェア（Twitter） */
function shareResult(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const text = container.innerText.replace(/\s{2,}/g," ").trim();
  const siteUrl = "https://haruki8513-alt.github.io/uranai-app/"; // 公開後にここにサイトURLを入れてください（例: https://your-site.example）
  const tweet = text + (siteUrl ? ("\n" + siteUrl) : "");
  const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(tweet);
  window.open(url, "_blank");
}

/* 画像保存（html2canvas） */
function saveImage(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const target = container.querySelector('.result-section') || container;
  const originalBg = target.style.background;
  // 一時的に白背景で保存（見栄え重視）
  target.style.background = "#ffffff";
  html2canvas(target, {scale:2, useCORS:true}).then(canvas => {
    const link = document.createElement('a');
    link.download = "診断結果.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    target.style.background = originalBg;
  }).catch(err=>{
    console.error(err);
    target.style.background = originalBg;
    alert("画像の保存に失敗しました。ブラウザの設定を確認してください。");
  });
}

/* 恋愛相性診断 */
function loveMatchResult(){
  const you=document.getElementById("lm_you").value||"あなた";
  const p=document.getElementById("lm_partner").value||"相手";
  const bd1=document.getElementById("lm_you_bd").value;
  const bd2=document.getElementById("lm_partner_bd").value;
  let base=50;
  if(bd1&&bd2){
    const d1=new Date(bd1),d2=new Date(bd2);
    const diff=Math.abs(d1-d2)/(1000*60*60*24);
    base=70-Math.min(diff,50)/2;
  }
  const rand=Math.floor(Math.random()*20)-10;
  let score=Math.max(0,Math.min(100,Math.round(base+rand)));
  let msg,icon;
  if(score>=80){ msg="とても相性が良い組み合わせ。お互いを支え合える関係になりやすいです。"; icon="💖"; }
  else if(score>=60){ msg="良い相性。少しの工夫で長続きしやすい関係です。"; icon="💞"; }
  else if(score>=40){ msg="普通の相性。価値観の違いを話し合えると◎。"; icon="🤝"; }
  else{ msg="少しすれ違いやすい相性。ペースを合わせる意識が大事です。"; icon="⚠️"; }
  const html = `
    <div class="result-section type-calm">
      <p><b>${icon} ${you} さんと ${p} さんの恋愛相性は…</b></p>
      <p style="font-size:24px;"><b>${score}%</b></p>
      <p>${msg}</p>
    </div>`;
  renderResultWithActions("love-match-result", html);
}
