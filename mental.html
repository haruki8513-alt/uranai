<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メンタル診断｜10問の簡易チェック</title><meta name="description" content="10問の質問で、最近の気分や心身の状態を振り返る簡易メンタルチェックです。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/mental.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;background:linear-gradient(180deg,#0b0f2f,#101a44);color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}a{color:#dfe6ff}.note{font-size:.9rem}</style></head><body><main class="wrap"><a href="./index.html">← トップへ戻る</a><h1>🌙 メンタル診断</h1><p>10問に答えて、最近の気分や心身の状態を振り返りましょう。</p><section class="panel" id="questions"></section><button onclick="diagnose()">チェックする</button><div id="result"></div><p class="note">この診断は医学的・心理学的な診断ではありません。つらい状態が続く、生活に支障がある、または自分を傷つけたい気持ちがある場合は、周囲の人や医療機関・地域の相談窓口に相談してください。</p></main><script>const qs=['最近気分が落ち込みやすいですか？','やる気が出ないことが多いですか？','人と話すのがしんどいですか？','寝ても疲れが取れないですか？','不安になりやすいですか？','自分を責めてしまうことがありますか？','集中するのが難しいと感じますか？','好きなことをしても楽しめないことがありますか？','生活リズムが乱れていますか？','休んでも気持ちが落ち着かないことがありますか？'];document.querySelector('#questions').innerHTML=qs.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');function diagnose(){let n=0;for(let i=0;i<10;i++)n+=+document.querySelector('#q'+i).value;let r=n<=2?'今のところ大きな負担は少なそうです':n<=5?'少し疲れや不安があるかもしれません':n<=7?'心身の負担がたまっている可能性があります':'かなりつらさを感じている可能性があります';document.querySelector('#result').innerHTML='<section class="result"><h2>チェック結果</h2><p><strong>'+r+'</strong></p><p>結果は診断ではありません。睡眠や休息を確保し、つらいときは一人で抱え込まず相談してください。</p></section>'}</script></body></html>
