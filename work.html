<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>無料仕事タイプ診断｜向いている働き方をチェック</title><meta name="description" content="10問で自分の仕事タイプや向いている働き方を簡単にチェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/work.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;background:linear-gradient(180deg,#0b0f2f,#101a44);color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}a{color:#dfe6ff}</style></head><body><main class="wrap"><a href="./index.html">← トップへ戻る</a><h1>💼 無料仕事タイプ診断</h1><p>10問に答えて、自分に合う働き方を考える参考にしましょう。</p><section class="panel" id="questions"></section><button onclick="diagnose()">診断する</button><div id="result"></div><p>この診断は適職を断定するものではありません。</p></main><script>const qs=['チームで働くのが好きですか？','新しいことに挑戦したいですか？','安定した環境が好きですか？','人と話す仕事が苦ではないですか？','一人で集中する時間が好きですか？','責任ある仕事を任されたいですか？','自由に動ける仕事が好きですか？','成果が数字で見えると嬉しいですか？','計画を立てて進めるのが得意ですか？','仕事は楽しさを重視しますか？'];document.querySelector('#questions').innerHTML=qs.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');function diagnose(){let n=0;for(let i=0;i<10;i++)n+=+document.querySelector('#q'+i).value;let r=n<=3?'安定志向タイプ':n<=6?'バランス型タイプ':n<=8?'自由・専門型タイプ':'挑戦・リーダータイプ';document.querySelector('#result').innerHTML='<section class="result"><h2>診断結果</h2><p>あなたは<strong>'+r+'</strong>です。</p><p>得意なことや大切にしたい環境を、仕事選びの参考にしてみましょう。</p></section>'}</script></body></html>
