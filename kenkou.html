<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>健康チェック｜簡易健康診断</title><meta name="description" content="生活習慣や体調の簡易チェックを行います。健康のヒントを表示します。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/kenkou.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>🏃‍♂️ 健康チェック</h1><p>最近の睡眠・運動・食事などの生活習慣を振り返ってみましょう。</p><section class="panel" id="questions"></section><button id="health-diag">チェックする</button><div id="result"></div><p class="note">これは簡易チェックです。体調不良が続く場合は医療機関に相談してください。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>
const qsHealth=['最近よく眠れていますか？','定期的に運動していますか？','野菜や果物を十分に摂っていますか？','水分をこまめに摂っていますか？','休息を取る時間を確保していますか？','仕事とプライベートのバランスは取れていますか？','最近頭痛やめまいがありますか？','疲れが取れにくいと感じますか？','食事の時間が不規則ですか？','ストレスを感じることが多いですか？'];
document.getElementById('questions').innerHTML=qsHealth.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');
document.getElementById('health-diag').addEventListener('click', ()=>{let n=0;for(let i=0;i<10;i++)n+=+document.getElementById('q'+i).value;let level='';let summary='';let strengths=[],cautions=[],advice=[];if(n>=8){level='良好';summary='生活習慣が比較的整っており、体調も安定している可能性が高いです。';strengths=['十分な睡眠や運動習慣がある','栄養バランスに気を使っている'];advice=['現在の習慣を続ける','無理をしすぎないように注意する'];}else if(n>=5){level='注意';summary='一部生活習慣に改善の余地があり、意識的な対処が必要です。';strengths=['部分的に良い習慣がある'];cautions=['疲れがたまりやすい'];advice=['睡眠時間を一定にする','週に2回程度の軽い運動を取り入れる'];}else{level='要改善';summary='生活習慣の見直しが必要な可能性があります。医療相談も検討してください。';strengths=[];cautions=['慢性的な疲労や体調不良のリスク'];advice=['まずは睡眠時間と食事の改善を最優先にする','必要なら専門家に相談する'];}
const obj={title:'健康チェック: '+level,summary:summary,strengths:strengths,cautions:cautions,advice:advice,extra:'結果は参考情報です。症状が続く場合は医療機関を受診してください。'};renderDetailedResult('#result', obj);});
</script>
</body></html>
