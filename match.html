<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>恋愛相性診断</title><meta name="description" content="二人の名前を入力して、恋愛相性を無料でチェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/match.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>💑 恋愛相性診断</h1><p>二人の名前から相性を気軽にチェックできます。</p><section class="panel"><label>あなたの名前<input id="you" placeholder="あなたの名前"></label><label>相手の名前<input id="partner" placeholder="相手の名前"></label><button id="diag-btn">相性を診断する</button></section><div id="result"></div><p>この診断はエンターテインメント目的の簡易診断です。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>
document.getElementById('diag-btn').addEventListener('click', ()=>{
  const you = document.getElementById('you').value || 'あなた';
  const partner = document.getElementById('partner').value || '相手';
  const score = 60 + Math.floor(Math.random()*41);
  const obj = { title: you + 'さんと' + partner + 'さんの相性: ' + score + '%', summary: you + 'さんと' + partner + 'さんの相性は' + score + '％です。', strengths: [], cautions: [], advice: [], extra: '' };
  if(score>=85){
    obj.summary = 'とても相性が良い組み合わせです。心地よく過ごせる関係の可能性が高いです。';
    obj.strengths = ['価値観が似ている','気持ちを伝え合いやすい'];
    obj.cautions = ['安定しすぎて刺激が減ることがある'];
    obj.advice = ['共通の趣味を増やして関係を深める','感謝をこまめに伝える'];
  } else if(score>=70){
    obj.summary = '良好な相性です。大きな不安は少ないでしょう。';
    obj.strengths = ['協調性がある','互いに支え合いやすい'];
    obj.cautions = ['すれ違いに注意'];
    obj.advice = ['時間を作ってコミュニケーションを取る','重要な話題は誠実に話す'];
  } else if(score>=55){
    obj.summary = '普通の相性です。相性を育てる工夫が大切です。';
    obj.strengths = ['バランスを取りやすい'];
    obj.cautions = ['価値観の違いに注意'];
    obj.advice = ['小さな配慮を心がける','意見が違うときは理由を聞く努力をする'];
  } else {
    obj.summary = '課題がある相性です。お互いの理解を深める必要があります。';
    obj.strengths = ['学び合うことができる可能性'];
    obj.cautions = ['感情的なすれ違いに注意'];
    obj.advice = ['距離感を見直す','自分の気持ちを冷静に整理して伝える'];
  }
  renderDetailedResult('#result', obj);
});
</script>
</body></html>
