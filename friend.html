<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>友達相性診断｜無料で相性をチェック</title><meta name="description" content="10問で友達との相性や話しやすさを無料チェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/friend.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;background:linear-gradient(180deg,#0b0f2f,#101a44);color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}a{color:#dfe6ff}</style></head><body><main class="wrap"><a href="./index.html">← トップへ戻る</a><h1>👭 友達相性診断</h1><p>10問に答えて、友達との相性を気軽にチェックできます。</p><section class="panel" id="questions"></section><button onclick="diagnose()">診断する</button><div id="result"></div><p>この診断はエンターテインメント目的の簡易診断です。</p></main><script>const qs=['一緒にいると落ち着きますか？','話が自然に続きますか？','趣味が似ていますか？','気を使わず話せますか？','一緒にいると楽しいですか？','悩みを相談できますか？','相手の気持ちを理解しやすいですか？','すぐ仲直りできますか？','時間が早く感じますか？','長く付き合えそうですか？'];document.querySelector('#questions').innerHTML=qs.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');function diagnose(){let n=0;for(let i=0;i<10;i++)n+=+document.querySelector('#q'+i).value;document.querySelector('#result').innerHTML='<section class="result"><h2>診断結果</h2><p>友達との相性は<strong>'+n*10+'%</strong>です。</p><p>相手を理解しようとする姿勢が、友情を深めるポイントです。</p></section>'}</script></body></html>
