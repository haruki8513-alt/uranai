<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ストレスチェック</title><meta name="description" content="9問の簡易チェックで、最近の疲れやストレスの状態を確認できます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/stress.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}.note{font-size:.9rem}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>😵 ストレスチェック</h1><p>最近の疲れや気分を振り返るための簡易チェックです。</p><section class="panel" id="questions"></section><button id="stress-diag">チェックする</button><div id="result"></div><p class="note">医学的な診断ではありません。つらい状態が続く場合は、医療機関や相談窓口にご相談ください。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>const qsStress=['最近疲れが取れにくいですか？','朝起きてもやる気が出ませんか？','眠りが浅いと感じますか？','食欲に変化がありますか？','イライラしやすいですか？','集中力が続きませんか？','人と話すのがしんどいですか？','不安になりやすいですか？','休んでも回復しにくいですか？'];document.getElementById('questions').innerHTML=qsStress.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');document.getElementById('stress-diag').addEventListener('click', ()=>{let total=0;for(let i=0;i<9;i++)total+=Number(document.getElementById('q'+i).value);let obj={title:'ストレスチェック結果',summary:'現在の状況を簡易的に判定します。',strengths:[],cautions:[],advice:[]};if(total<=3){obj.summary='現在は比較的安定している可能性があります。';obj.strengths=['日常の回復ができている'];obj.advice=['十分な休息を取り続ける','軽い運動や気分転換を取り入れる'];}else if(total<=6){obj.summary='ストレスがたまりやすい状態です。対処が必要です。';obj.cautions=['疲れが蓄積しやすい'];obj.advice=['休息を意識的に取る','信頼できる人に相談する'];}else{obj.summary='かなり負担が蓄積している可能性があります。専門家への相談も検討してください。';obj.cautions=['無理を続けると体調不良につながる可能性'];obj.advice=['早めに休息を取る','必要なら専門窓口に相談する'];}renderDetailedResult('#result', obj);});</script>
</body></html>
