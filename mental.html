<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メンタル診断</title><meta name="description" content="10問の質問で、最近の気分や心身の状態を振り返る簡易メンタルチェックです。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/mental.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preload" href="./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png" as="image"><script src="./assets/site.js" defer></script><script src="./assets/result.js" defer></script><style>body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,13,45,.78),rgba(16,26,68,.88)),url('./BCO.755a2eff-b3fc-4a1d-aa77-5dcb6907f237.png') center/cover fixed;color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.home{display:inline-block;margin-bottom:12px;color:#dfe6ff}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}.note{font-size:.9rem}</style></head><body><main class="wrap"><a class="home" href="./index.html">← トップへ戻る</a><h1>🌙 メンタル診断</h1><p>10問に答えて最近の気分や心身の状態を振り返りましょう。</p><section class="panel" id="questions"></section><button id="mental-diag">チェックする</button><div id="result"></div><p class="note">この診断は医学的・心理学的な診断ではありません。つらい状態が続く、生活に支障がある場合は、周囲の人や相談窓口に相談してください。</p></main>
<footer class="footer" style="text-align:center;padding:18px"><a href="./privacy.html">プライバシー</a> ・ <a href="./terms.html">利用規約</a> ・ <a href="./contact.html">お問い合わせ</a></footer>
<script>const qsMental=['最近気分が落ち込みやすいですか？','やる気が出ないことが多いですか？','人と話すのがしんどいですか？','寝ても疲れが取れないですか？','不安になりやすいですか？','自分を責めてしまうことがありますか？','集中するのが難しいと感じますか？','好きなことをしても楽しめないことがありますか？','生活リズムが乱れていますか？','休んでも気持ちが落ち着かないことがありますか？'];document.getElementById('questions').innerHTML=qsMental.map((q,i)=>'<label for="q'+i+'">'+(i+1)+'．'+q+'</label><select id="q'+i+'"><option value="1">はい</option><option value="0">いいえ</option></select>').join('');document.getElementById('mental-diag').addEventListener('click', ()=>{let n=0;for(let i=0;i<10;i++)n+=+document.getElementById('q'+i).value;let obj={title:'メンタルチェック結果',summary:'最近の心身の状態を簡易的に判断します。',strengths:[],cautions:[],advice:[]};if(n<=2){obj.summary='今のところ大きな負担は少なそうです。';obj.strengths=['日常の回復が取れている可能性'];obj.advice=['この調子を保つために規則正しい生活を心がけてください'];}else if(n<=5){obj.summary='疲れや不安が見られる状況です。対処をおすすめします。';obj.cautions=['無理をすると症状が悪化する可能性'];obj.advice=['休息を意識的に取る','信頼できる人に相談する'];}else if(n<=7){obj.summary='心身に負担がかかっている可能性があります。生活習慣の見直しや相談を検討してください。';obj.cautions=['症状が長引く場合は専門家への相談を検討'];obj.advice=['睡眠の改善を試みる','身近な人に状況を伝える'];}else{obj.summary='かなり負担が蓄積している可能性があります。早めの対応をおすすめします。';obj.cautions=['放置すると体調不良に繋がる恐れ'];obj.advice=['専門の相談窓口や医療機関の受診を検討する','まずは休息を確保する'];}renderDetailedResult('#result', obj);});</script>
</body></html>
