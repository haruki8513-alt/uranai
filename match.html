<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>恋愛相性診断｜無料で二人の相性をチェック</title><meta name="description" content="二人の名前を入力して、恋愛相性を無料でチェックできます。"><link rel="canonical" href="https://haruki8513-alt.github.io/uranai/match.html"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>body{margin:0;background:linear-gradient(180deg,#0b0f2f,#101a44);color:#fff;font-family:system-ui,sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.panel,.result{padding:22px;border-radius:18px;background:rgba(255,255,255,.1);margin:18px 0}.result{background:#fff;color:#333}.result h2{color:#514277}label{display:block;margin:14px 0 6px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}button{margin-top:18px;border:0;background:#f4d35e;color:#4d3b00;font-weight:bold}a{color:#dfe6ff}</style></head><body><main class="wrap"><a href="./index.html">← トップへ戻る</a><h1>💑 恋愛相性診断</h1><p>二人の名前から相性を気軽にチェックできます。</p><section class="panel"><label for="you">あなたの名前</label><input id="you" placeholder="あなたの名前"><label for="partner">相手の名前</label><input id="partner" placeholder="相手の名前"><button onclick="diagnose()">相性を診断する</button></section><div id="result"></div><p>この診断はエンターテインメント目的の簡易診断です。</p><a href="./love.html">恋愛タイプ診断へ →</a></main><script>function diagnose(){const a=document.querySelector('#you').value||'あなた',b=document.querySelector('#partner').value||'相手',n=60+Math.floor(Math.random()*41);document.querySelector('#result').innerHTML='<section class="result"><h2>'+a+'さんと'+b+'さんの相性</h2><p><strong>相性は'+n+'%</strong>です。</p><p>お互いの違いを楽しみながら、素直に話すことが関係を深めるポイントです。</p></section>'}</script></body></html>
